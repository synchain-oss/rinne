a plug-in in the loop outputs NaN/Inf, Rinne Output zeroes and counts them (amber, lit for 5 s); invalid values inside Rinne Input cut the return (red).","Quand un plug-in de la boucle émet des NaN/Inf, Rinne Output les met à zéro et les compte (ambre, allumé 5 s) ; des valeurs invalides à l’intérieur de Rinne Input coupent le retour (rouge).",null,null,null],"in.lamp.run.tip":["回送持续顶着限制器时亮起；失控保护打开时会自动降低反馈，降到 −24 dB 仍止不住就切断回送。","Lit while the return keeps hitting the limiter. With runaway protection on, feedback is lowered automatically, and the return is cut if −24 dB isn’t enough.","Allumé tant que le retour reste contre le limiteur. Avec la protection anti-emballement activée, la réinjection est réduite automatiquement, et le retour est coupé si −24 dB ne suffisent pas.",null,null,null],"in.guard.label":["失控保护","RUNAWAY PROTECTION","ANTI-EMBALLEMENT",["m",9.5,400,0.1,1,150],null,null],"in.guard.tip":["回送持续过载时自动降低反馈（每秒 6 dB），平静 3 秒后回升。反馈不超过 90% 且环路不带增益时不会介入。","When the return keeps overloading, feedback is lowered automatically (6 dB per second) and comes back after 3 s of calm. It stays out of the way at 90% feedback or less with no gain in the loop.","Si le retour reste en surcharge, la réinjection est réduite automatiquement (6 dB par seconde) et remonte après 3 s de calme. Elle n’intervient pas à 90 % de réinjection ou moins sans gain dans la boucle.",null,null,null],"in.meter.eyebrow":["电平","LEVELS","NIVEAUX",["m",9,400,0.22,1,200],null,null],"in.meter.in":["输入","IN","ENT.",["m",9,400,0.14,1,48],null,null],"in.meter.ret":["回送","RETURN","RET.",["m",9,400,0.14,1,48],null,null],"in.meter.out":["输出","OUT","SORT.",["m",9,400,0.14,1,48],null,null],"in.meter.retTip":["回送在增益之前的电平：反馈为 0 时也会跳动，可用来确认环路已通。","Return level before gain: it moves even at 0% feedback, so you can check the loop is closed.","Niveau du retour avant gain : il bouge même à 0 % de réinjection, ce qui permet de vérifier que la boucle est fermée.",null,null,null],"in.meter.muted":["已静音","MUTED","MUET",["m",9,400,0.14,1,110],null,null],"in.meter.fadeIn":["淡入中","FADING IN","FONDU ENTR.",["m",9,400,0.14,1,110],null,null],"in.meter.clearTip":["点击清除峰值保持","Click to clear the peak hold","Cliquez pour effacer le maintien de crête",null,null,null],"in.num.range":["超出范围：{min}–{max}","Out of range: {min}–{max}","Hors plage : {min}–{max}",["m",9,400,0.06,1,200],null,null],"in.hint.ready":["就绪","Ready","Prêt",["s",9.5,400,0,1,470],null,null],"in.hint.unpaired":["下一步：插入 Rinne Output（最简单：推子前区最后一格）","Next: insert Rinne Output (simplest: the last pre-fader slot)","Étape suivante : insérez Rinne Output (le plus simple : dernier slot pré-fader)",["s",9.5,400,0,1,470],null,null],"in.hint.zero":["已连接。反馈量从 0 开始，慢慢往上调","Connected. Feedback starts at 0 — raise it slowly","Connecté. La réinjection démarre à 0 — montez-la lentement",["s",9.5,400,0,1,470],null,null],"in.hint.drag":["Shift 微调 · 双击复位 · Ctrl（mac：Cmd）+ 单击输入数值","Shift: fine · Double-click: reset · Ctrl-click (Cmd on Mac) to type","Maj : affiner · Double-clic : réinitialiser · Ctrl+clic (Cmd sur Mac) pour saisir",["s",9.5,400,0,1,470],null,null],"in.hint.cut":["回送已切断，点「恢复回送」重新淡入","Return cut — click Restore return to fade back in","Retour coupé — cliquez sur Rétablir le retour pour le refaire entrer en fondu",["s",9.5,400,0,1,470],null,null],"out.brand.title":["Rinne Output","Rinne Output","Rinne Output",["g",16,600,0,1,130],null,null],"out.brand.eyebrow":["SYNCHAIN · 回环 · 链尾","SYNCHAIN · RINNE · CHAIN END","SYNCHAIN · RINNE · FIN CHAÎNE",["m",8.5,400,0.22,1,230],null,null],"out.place":["放在你想放进环路的最后一个插件之后、推子分隔线之上（最简单：推子前区最后一格）。","Put this after the last plug-in you want in the loop and above the fader divider (simplest: the last pre-fader slot).","Placez-le après le dernier plug-in voulu dans la boucle, au-dessus de la séparation du fader (le plus simple : dernier slot pré-fader).",["g",11,600,0,2,424],null,null],"out.group.autoTip":["已自动跟随最近一个未配对的 Rinne Input（组 {g}）；点任意组改为手动。","Following the most recent unpaired Rinne Input ( e}” saved","Préréglage « {name} » enregistré",["s",11.5,400,0,2,280],"green",null],"toast.presetDeleted":["已删除预设「{name}」","Preset “{name}” deleted","Préréglage « {name} » supprimé",["s",11.5,400,0,2,280],"green",null],"toast.presetBroken":["预设文件无法读取，未载入","That preset file can’t be read, so it wasn’t loaded","Ce fichier de préréglage est illisible, il n’a pas été chargé",["s",11.5,400,0,2,280],"amber",null],"toast.diagCopied":["诊断信息已复制","Diagnostics copied","Diagnostics copiés",["s",11.5,400,0,2,280],"green",null],"toast.copyFail":["复制失败：{reason}","Copy failed: {reason}","Échec de la copie : {reason}",["s",11.5,400,0,2,280],"red",null],"toast.restored":["回送已恢复，从 0 淡入","Return restored, fading in from 0","Retour rétabli, il revient en fondu depuis 0",["s",11.5,400,0,2,280],"green",null],"toast.over100":["超过 100%：混合在 50% 及以上时环路会自激，由限制器压住","Above 100%: with Mix at 50% or more the loop self-oscillates and the limiter holds it","Au-delà de 100 % : avec le mix à 50 % ou plus, la boucle auto-oscille et le limiteur la contient",["s",11.5,400,0,2,280],"amber",null],"toast.moved":["已移到空闲组 {g}。再到本轨的 Rinne Output 点「重新配对」。","Moved to free group {g}. Now click Re-pair on this track’s Rinne Output.","Déplacé vers le groupe libre {g}. Cliquez ensuite sur Réappairer dans le Rinne Output de cette piste.",["s",11.5,400,0,2,280],"green",null],"about.lockup":["SYNCHAIN","SYNCHAIN","SYNCHAIN",["g",11,600,0.2,1,120],null,null],"about.title.in":["关于 Rinne Input","About Rinne Input","À propos de Rinne Input",["g",16,600,0,1,400],null,null],"about.title.out":["关于 Rinne Output","About Rinne Output","À propos de Rinne Output",["g",16,600,0,1,400],null,null],"about.product":["Synchain Rinne（回环）","Synchain Rinne","Synchain Rinne",null,null,null],"about.build":["{role} {v} · 构建 {sha} · {fmt} · {arch}","{role} {v} · build {sha} · {fmt} · {arch}","{role} {v} · build {sha} · {fmt} · {arch}",null,null,null],"about.origin":["读作 RIN-neh，取自日文「輪廻」（りんね），与中文「轮回」同字。","Pronounced RIN-neh, from the Japanese 輪廻 (rinne) — the cycle of rebirth.","Se prononce RIN-neh, du japonais 輪廻 (rinne) — le cycle des renaissances.",null,null,null],"about.license":["源码 GPL-3.0-or-later；二进制整体按 GPLv3 分发，其中 JUCE 部分适用 AGPLv3（GPLv3 §13）。不提供任何担保。","Source code: GPL-3.0-or-later. The binary as a whole is distributed under GPLv3; its JUCE portion is covered by AGPLv3 (GPLv3 §13). No warranty.","Source code: GPL-3.0-or-later. The binary as a whole is distributed under GPLv3; its JUCE portion is covered by AGPLv3 (GPLv3 §13). No warranty.",null,null,null],"about.viewLicense":["查看许可证","View licence","Voir la licence",["g",12,600,0,1,170],null,null],"about.fonts":["界面字体：Space Grotesk；Rinne Sans 与 Rinne Mono（由 IBM Plex Sans / IBM Plex Mono 子集化，并按 SIL OFL 1.1 改名）；Noto Sans SC。均以 SIL Open Font License 1.1 授权。","UI fonts: Space Grotesk; Rinne Sans and Rinne Mono (subset from IBM Plex Sans / IBM Plex Mono and renamed under the SIL OFL 1.1); Noto Sans SC — all under the SIL Open Font License 1.1.","Polices de l’interface : Space Grotesk ; Rinne Sans et Rinne Mono (sous-ensembles d’IBM Plex Sans / IBM Plex Mono, renommés selon la SIL OFL 1.1) ; Noto Sans SC — toutes sous licence SIL Open Font License 1.1.",null,null,null],"about.tm":["基于 JUCE 构建。VST 是 Steinberg Media Technologies GmbH 的注册商标；Audio Units 是 Apple Inc. 的商标。","Built with JUCE. VST is a registered trademark of Steinberg Media Technologies GmbH. Audio Units is a trademark of Apple Inc.","Conçu avec JUCE. VST est une marque déposée de Steinberg Media Technologies GmbH. Audio Units est une marque d’Apple Inc.",null,null,null],"about.link.source":["源代码","Source code","Code source",["g",12,600,0,1,170],null,null],"about.link.site":["官网","Website","Site web",["g",12,600,0,1,170],null,null],"about.link.contact":["联系","Contact","Contact",["g",12,600,0,1,170],null,null],"about.link.notices":["第三方许可","Third-party notices","Licences tierces",["g",12,600,0,1,170],null,null],"about.linkTip":["在浏览器中打开","Open in browser","Ouvrir dans le navigateur",null,null,null],"about.noGithub":["没有 GitHub 账号？把诊断信息发到 contact@synchain.ca","No GitHub account? Send the diagnostics to contact@synchain.ca","Pas de compte GitHub ? Envoyez les diagnostics à contact@synchain.ca",null,null,null],"about.diagNote":["诊断信息包含版本、系统、宿主、音频设置和环路状态，不含文件路径、用户名或轨道名（轨道名只给是否一致）。","Diagnostics include versions, system, host, audio settings and loop state — no file paths, user names or track names (only whether they match).","Les diagnostics comprennent les versions, le système, l’hôte, les réglages audio et l’état de la boucle — ni chemins de fichiers, ni noms d’utilisateur, ni noms de piste (seulement s’ils correspondent).",null,null,null],"about.diagPreview":["诊断预览","DIAGNOSTICS PREVIEW","APERÇU DES DIAGNOSTICS",["m",9,400,0.22,1,200],null,null],"about.copy":["复制诊断信息","Copy diagnostics","Copier les diagnostics",["g",12,600,0,1,170],null,null],"about.copied":["已复制","Copied","Copié",["g",12,600,0,1,170],null,null],"about.copyFail":["复制失败：{reason}","Copy failed: {reason}","Échec de la copie : {reason}",null,null,null],"about.viewRules":["查看使用规则","View the rules","Voir les règles",["g",12,600,0,1,170],null,null],"about.adv.title":["高级设置","ADVANCED","AVANCÉ",["m",9,400,0.22,1,200],null,null],"about.adv.resetOnPlay":["起播时清空环路","Clear the loop when playback starts","Vider la boucle au démarrage de la lecture",["s",11.5,400,0,1,260],null,null],"about.adv.resetOnPlayTip":["默认开：每次开始播放都从干净的环路起步，导出与播放从起点就一致。","On by default: every playback starts from a clean loop, so export and playback match from the very start.","Activé par défaut : chaque lecture démarre d’une boucle propre, l’export et la lecture concordent donc dès le début.",null,null,null],"about.adv.tail":["Tail 模式","Tail mode","Mode Tail",["s",11.5,400,0,1,260],null,null],"about.adv.tail.auto":["自动","Auto","Auto",["g",12,600,0,1,120],null,null],"about.adv.tail.infinite":["无限","Infinite","Infini",["g",12,600,0,1,120],null,null],"about.adv.tail.s30":["30 秒","30 s","30 s",["g",12,600,0,1,120],null,null],"about.adv.tailTip":["告诉宿主本插件的尾音有多长，防止宿主在静音时挂起插件、把环路断开。自动 = VST3 无限、AU 30 秒。","Tells the host how long this plug-in’s tail is, so it doesn’t suspend the plug-in during silence and break the loop. Auto = infinite for VST3, 30 s for AU.","Indique à l’hôte la durée de queue de ce plug-in, pour qu’il ne le suspende pas pendant le silence et n’interrompe pas la boucle. Auto = infini en VST3, 30 s en AU.",null,null,null],"about.adv.diagLog":["记录诊断日志","Record a diagnostics log","Enregistrer un journal de diagnostic",["s",11.5,400,0,1,260],null,null],"about.adv.diagLogTip":["打开后把最近的环路事件记进诊断信息，便于反馈问题；默认关。这是本机设置，对这台电脑上的所有工程生效。","Adds recent loop events to the diagnostics for bug reports; off by default. This is a setting for this computer and applies to every project.","Ajoute les événements récents de la boucle aux diagnostics pour les rapports de bug ; désactivé par défaut. Réglage propre à cet ordinateur, valable pour tous les projets.",null,null,null],"about.adv.note":["起播清空与 tail 模式随工程保存，只影响本实例；诊断日志开关是本机设置。","Clear-on-play and tail mode are saved with the project for this instance; the diagnostics log switch is a setting for this computer.","Le vidage au démarrage et le mode Tail sont enregistrés avec le projet pour cette instance ; l’interrupteur du journal de diagnostic est un réglage propre à cet ordinateur.",null,null,null],"about.adv.noteOut":["tail 模式随工程保存，只影响本实例；诊断日志开关是本机设置。","Tail mode is saved with the project for this instance; the diagnostics log switch is a setting for this computer.","Le mode Tail est enregistré avec le projet pour cette instance ; l’interrupteur du journal de diagnostic est un réglage propre à cet ordinateur.",null,null,null],"rules.title":["使用 Rinne 前必读：下面四条决定环路能否闭合，以及会不会伤到耳朵和音箱。","Read this before using Rinne: these four rules decide whether the loop closes — and whether it can hurt your ears or speakers.","À lire avant d’utiliser Rinne : ces quatre règles déterminent si la boucle se ferme — et si elle peut abîmer vos oreilles ou vos enceintes.",null,null,null],"rules.r1.lead":["放置位置","Placement","Placement",["g",13,600,0,1,200],null,null],"rules.r1.body":["Rinne Input 插在通道插入链的第一格；Rinne Output 插在你想放进环路的最后一个插件之后、推子分隔线之上（最简单：推子前区最后一格；宿主没有推子前区时，插在插入链最后一格）。两者之间的插件，包括宿主自带的插入效果器，都在环路里，它们自身的延迟会叠加到环路延迟 D 上；Output 之后的插件、推子、声像和发送都不在环路里。","Put Rinne Input on the first insert slot of the channel. Put Rinne Output after the last plug-in you want in the loop and above the fader divider (simplest: the last pre-fader slot; if your host has no pre-fader section, the last insert slot). Every plug-in between them — including the host’s own insert effects — is inside the loop, and its own latency adds to the loop delay D; plug-ins after Output, the fader, pan and sends are not.","Placez Rinne Input dans le premier slot d’insert de la voie. Placez Rinne Output après le dernier plug-in voulu dans la boucle et au-dessus de la séparation du fader (le plus simple : dernier slot pré-fader ; si votre hôte n’a pas de section pré-fader, dernier slot d’insert). Tout plug-in situé entre les deux — y compris les effets d’insert propres à l’hôte — est dans la boucle, et sa propre latence s’ajoute au délai de boucle D ; les plug-ins après Output, le fader, le panoramique et les envois n’y sont pas.",null,null,null],"rules.r2.lead":["从 0 开始","Start from 0","Partir de 0",["g",13,600,0,1,200],null,null],"rules.r2.body":["新实例的反馈量是 0，加载工程或预设时回送从 0 淡入。先调低监听音量，再从 0 慢慢往上调：回送越多越容易自激。混合在 50% 及以上、环路里没有衰减时，反馈超过 100% 一定会自激；环路里的插件带增益（EQ 提升、压缩补偿、饱和）时，更低也可能自激。限制器和失控保护默认开启，但挡不住长时间的高电平。","A new instance starts at 0% feedback, and the return fades in from 0 when a project or preset loads. Turn your monitors down, then raise feedback slowly from 0: the more return, the easier the loop self-oscillates. With Mix at 50% or more and nothing attenuating in the loop, feedback above 100% always self-oscillates; gain-adding plug-ins in the loop (EQ boosts, compressor make-up, saturation) can make it happen lower. The limiter and runaway protection are on by default, but they can’t protect you from sustained loud levels.","Une nouvelle instance démarre à 0 % de réinjection, et le retour revient en fondu depuis 0 au chargement d’un projet ou d’un préréglage. Baissez le volume d’écoute, puis montez lentement la réinjection depuis 0 : plus il y a de retour, plus la boucle entre facilement en auto-oscillation. Avec le mix à 50 % ou plus et rien qui atténue dans la boucle, une réinjection au-delà de 100 % entre toujours en auto-oscillation ; des plug-ins ajoutant du gain dans la boucle (boost d’EQ, compensation de compresseur, saturation) peuvent la provoquer plus bas. Le limiteur et la protection anti-emballement sont activés par défaut, mais ils ne vous protègent pas contre des niveaux élevés prolongés.",null,null,null],"rules.r3.lead":["出事先切断","Cut it first","Couper d’abord",["g",13,600,0,1,200],null,null],"rules.r3.body":["听到啸叫或异常，先按「紧急切断」：它只切断回送，干声照常通过；恢复请点提示条里的「恢复回送」。窗口关着时，最快的办法是在宿主里旁路 Rinne Input。推子不在环路里，只拉推子只是听不见，环路仍在增长；停止播放和静音也停不住自激。","If you hear howling or anything odd, press Panic first: it cuts only the return, and the dry signal keeps playing; restore it with Restore return in the notice bar. With the window closed, the fastest way is to bypass Rinne Input in the host. The fader isn’t in the loop — pulling it down only hides the sound while the loop keeps growing, and stopping playback or muting won’t stop self-oscillation either.","Si vous entendez un larsen ou quoi que ce soit d’anormal, appuyez d’abord sur Coupure d’urgence : elle ne coupe que le retour, le signal sec continue de passer ; rétablissez-le avec Rétablir le retour dans la barre d’avis. Fenêtre fermée, le plus rapide est de contourner Rinne Input dans l’hôte. Le fader n’est pas dans la boucle — le baisser ne fait que masquer le son pendant que la boucle continue de croître, et arrêter la lecture ou couper le son n’arrête pas non plus l’auto-oscillation.",null,null,null],"rules.r4.lead":["一组一对","One pair per group","Une paire par groupe",["g",13,600,0,1,200],null,null],"rules.r4.body":["一个组（A–H）只放一个 Rinne Input 和一个 Rinne Output，两端组号一致才会连接。复制轨道会连组号一起复制：副本会显示「冲突」，在副本的 Rinne Input 上点「移到空闲组」，再在副本的 Rinne Output 上点「重新配对」。","A group (A–H) holds one Rinne Input and one Rinne Output, and they connect only when their groups match. Duplicating a track copies its group too: the copy shows CONFLICT — click Move to free group on the copy’s Rinne Input, then Re-pair on the copy’s Rinne Output.","Un groupe (A–H) contient un Rinne Input et un Rinne Output, et ils ne se connectent que si leurs groupes correspondent. Dupliquer une piste copie aussi son groupe : la copie affiche CONFLIT — cliquez sur « Vers un groupe libre » dans le Rinne Input de la copie, puis sur « Réappairer » dans son Rinne Output.",null,null,null],"rules.btn.start":["我已了解，开始导览","Got it, start the tour","Compris, lancer la visite",["g",12,600,0,1,170],null,null],"rules.btn.skip":["跳过导览","Skip the tour","Passer la visite",["g",12,600,0,1,170],null,null],"rules.btn.continue":["继续导览","Continue to the tour","Continuer la visite",["g",12,600,0,1,170],null,null],"rules.readFirst":["请先读到最后一条","Read to the last rule first","Lisez d’abord jusqu’à la dernière règle",null,null,null],"rules.footnote":["以后可点问号按钮或在「关于」里重新查看","You can reread these from the “?” button or About","Vous pourrez les relire via le bouton « ? » ou À propos",null,null,null],"tour.common.clickAnywhere":["左键点击任意处继续","Left-click anywhere to continue","Clic gauche n’importe où pour continuer",["m",9,400,0.1,1,328],null,null],"tour.common.skip":["跳过","Skip","Passer",["g",12,600,0,1,120],null,null],"tour.common.prev":["上一步","Back","Précédent",["g",12,600,0,1,120],null,null],"tour.common.next":["下一步","Next","Suivant",["g",12,600,0,1,120],null,null],"tour.common.done":["完成","Done","Terminé",["g",12,600,0,1,120],null,null],"tour.common.step":["{i}/{n}","{i}/{n}","{i}/{n}",null,null,null],"tour.in.step1.title":["欢迎使用 Rinne Input","Welcome to Rinne Input","Bienvenue dans Rinne Input",["g",16,600,0,1,328],null,null],"tour.in.step1.body":["这是回环的返回端，插在通道插入链的第一格：读回环路尾端送回的信号，再和干声混合。所有调节都在这一页，花半分钟认一下这几件东西。","This is the return end of the loop. It sits on the first insert slot, reads back what the end of the loop sends, and mixes it with the dry signal. Every control is on this page — take thirty seconds to meet them.","Voici l’extrémité retour de la boucle. Placée dans le premier slot d’insert, elle relit ce qu’envoie la fin de la boucle et le mélange au signal sec. Tous les réglages sont sur cette page — prenez trente secondes pour les découvrir.",["s",12.5,400,0,6,328],null,null],"tour.in.step2.title":["组与配对","Group and pairing","Groupe et appairage",["g",16,600,0,1,328],null,null],"tour.in.step2.body":["在你想放进环路的最后一个插件之后插入 Rinne Output（最简单：推子前区最后一格），它会自动加入一个组。灯变绿就是已连接；下面的轨道名与本轨一致，说明两端很可能在同一条轨上。","Insert Rinne Output after the last plug-in you want in the loop (simplest: the last pre-fader slot); it joins a group by itself. Green means connected; if the track name below matches this one, both ends are most likely on one track.","Insérez Rinne Output après le dernier plug-in voulu dans la boucle (le plus simple : dernier slot pré-fader) ; il rejoint un groupe de lui-même. Vert = connecté ; un nom de piste identique ci-dessous indique très probablement la même piste.",["s",12.5,400,0,5,328],null,null],"tour.in.step3.title":["反馈量","Feedback","Réinjection",["g",16,600,0,1,328],null,null],"tour.in.step3.body":["回送的增益，新实例从 0 开始。先调低监听音量再慢慢加：回送越多越容易自激。混合在 50% 及以上、环路里没有衰减时，超过 100%（表盘琥珀段）一定会自激；环路里的插件带增益时，更低也可能自激。","The gain of the return; it starts at 0. Turn your monitors down and raise it slowly: the more return, the easier it self-oscillates. With Mix at 50% or more and no loss in the loop, above 100% (the amber arc) it always does; gain inside the loop can make it happen sooner.","Le gain du retour ; il démarre à 0. Baissez l’écoute et montez-le lentement : plus de retour, plus vite l’auto-oscillation. Avec le mix à 50 % ou plus et sans perte dans la boucle, elle est certaine au-delà de 100 % (l’arc ambre) ; un gain dans la boucle l’avance.",["s",12.5,400,0,5,328],null,null],"tour.in.step4.title":["环路延迟 D","Loop delay D","Délai de boucle D",["g",16,600,0,1,328],null,null],"tour.in.step4.body":["信号绕一圈的固定时间，与缓冲大小和导出方式无关，所以播放和导出听起来一样。D 不能小于最小值（本会话见过的最大块长）；设得更小时按最小值运行，并在这里标出实际 D。","The fixed time for one trip around the loop — the same at any buffer size and in export. It can’t go below the minimum (the largest block this session); set it lower and Rinne runs at the minimum and shows the actual D.","Le temps fixe d’un tour de boucle — identique quelle que soit la taille de tampon, et à l’export. Il ne peut pas descendre sous le minimum (le plus grand bloc de cette session) ; réglé plus bas, Rinne fonctionne au minimum et affiche le D réel.",["s",12.5,400,0,5,328],null,null],"tour.in.step5.title":["安全与紧急切断","Safety and Panic","Sécurité et coupure d’urgence",["g",16,600,0,1,328],null,null],"tour.in.step5.body":["回送路径始终有直流阻断和软削波，限制器和失控保护默认开启。出事先按「紧急切断」：导览和弹窗打开时也能点；恢复按钮在上方的提示条里。","The return path always has DC blocking and soft clipping; the limiter and runaway protection are on by default. If anything goes wrong, press Panic — it works even with this tour or a dialog open. Restore return is in the notice bar.","Le retour passe toujours par un blocage DC et un écrêtage doux ; limiteur et protection anti-emballement sont actifs par défaut. En cas de souci, appuyez sur Coupure d’urgence, même visite ouverte. Rétablir le retour est dans la barre d’avis.",["s",12.5,400,0,5,328],null,null],"tour.in.step6.title":["随时重看","See it again","À revoir à tout moment",["g",16,600,0,1,328],null,null],"tour.in.step6.body":["想再看一遍使用规则和这段导览，点右下角的问号按钮。点版本号可以查看许可、高级设置和诊断信息。","Click the “?” button at the bottom right to see the rules and this tour again. Click the version number for licences, advanced settings and diagnostics.","Cliquez sur le bouton « ? » en bas à droite pour revoir les règles et cette visite. Cliquez sur le numéro de version pour les licences, les réglages avancés et les diagnostics.",["s",12.5,400,0,5,328],null,null],"tour.out.step1.title":["欢迎使用 Rinne Output","Welcome to Rinne Output","Bienvenue dans Rinne Output",["g",16,600,0,1,328],null,null],"tour.out.step1.body":["这是回环的发送端，放在你想放进环路的最后一个插件之后（最简单：推子前区最后一格），把环路尾端的信号送回 Rinne Input。它没有旋钮，全部调节都在 Rinne Input。","The send end of the loop. It sits after the last plug-in you want in the loop (simplest: the last pre-fader slot) and sends the end of the loop back to Rinne Input. It has no knobs — every control is in Rinne Input.","L’extrémité envoi de la boucle. Placée après le dernier plug-in voulu dans la boucle (le plus simple : dernier slot pré-fader), elle renvoie la fin de la boucle vers Rinne Input. Elle n’a aucun bouton — tous les réglages sont dans Rinne Input.",["s",12.5,400,0,6,328],null,null],"tour.out.step2.title":["组 A–H","Group A–H","Groupe A–H",["g",16,600,0,1,328],null,null],"tour.out.step2.body":["新插入的 Rinne Output 会自动加入最近一个未配对的 Rinne Input 所在的组（标「自动」），同名轨优先。不对就点任意组改为手动。","A new Rinne Output joins the group of the most recent unpaired Rinne Input (marked AUTO), preferring one on a track with the same name. If that’s wrong, click any group to set it by hand.","Un nouveau Rinne Output rejoint le groupe du dernier Rinne Input non appairé (marqué AUTO), de préférence sur une piste de même nom. Si ce n’est pas le bon, cliquez sur un groupe pour le choisir à la main.",["s",12.5,400,0,4,328],null,null],"tour.out.step3.title":["配对状态","Pairing","Appairage",["g",16,600,0,1,328],null,null],"tour.out.step3.body":["灯变绿就是已连接。两行轨道名一致，说明两端很可能在同一条轨上；宿主不给轨道名时显示「无法核验」，不影响使用。","A green lamp means connected. Matching track names mean both ends are most likely on one track; if the host gives no names you’ll see “Can’t verify”, which is fine.","Voyant vert = connecté. Des noms de piste identiques indiquent très probablement la même piste ; sans noms de l’hôte, « Vérification impossible » s’affiche, sans conséquence.",["s",12.5,400,0,4,328],null,null],"tour.out.step4.title":["随时重看","See it again","À revoir à tout moment",["g",16,600,0,1,328],null,null],"tour.out.step4.body":["想再看一遍使用规则和这段导览，点右下角的问号按钮。","Click the “?” button at the bottom right to see the rules and this tour again.","Cliquez sur le bouton « ? » en bas à droite pour revoir les règles et cette visite.",["s",12.5,400,0,4,328],null,null]};

function hashScene() { const m = /scene=([^&]+)/.exec(location.hash || ''); if (!m) return null; const id = decodeURIComponent(m[1]); return SCENE_BY[id] ? id : null; }
