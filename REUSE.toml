# SPDX-License-Identifier: GPL-3.0-or-later
# Derived from synchain-oss/scvb; see upstream/ci.json
#
# 许可与版权的机读登记（REUSE 3.3）。小节一次建好，以后只往自己负责的那一节里加块；
# 小节标记由 run-checks 的 reuse 检查核对，不要删改或调换顺序。
# 同一文件匹配多个块时，后面的块优先，所以兜底块必须放在最前。
version = 1

# --- section:base ---
# 兜底：本仓自己写的一切。能写注释的源文件仍须逐个加 SPDX 头，由 check-spdx 把关。
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- section:untagged ---
# 不能带注释头的自有文件：单行钉版文件、JSON、golden 数据。许可与兜底相同，单列出来一眼可查。
[[annotations]]
path = [".*-version", ".juce-commit", ".prettierrc.json", "upstream/*.json", "tests/golden/**"]
SPDX-FileCopyrightText = "2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- section:juce-web-js ---
# JUCE 自带的前端辅助脚本，随 JUCE 的许可，不加 Synchain 版权。
[[annotations]]
path = "web/js/juce/**"
precedence = "override"
SPDX-FileCopyrightText = "Raw Material Software Limited"
SPDX-License-Identifier = "AGPL-3.0-only"

# --- section:juce-patches ---
# 对 JUCE 源码的补丁（只在确实需要时才有）：随 JUCE 的许可。补丁入库时在此加块。

# --- section:fonts ---
# 字体逐文件登记 OFL-1.1，版权行与字体 name 表 nameID 0 逐字一致，不用目录通配：
# 同目录的说明文件是本仓自己写的，归兜底块。字体入库时每个文件在此加一个块。

# --- section:third-party-notices ---
# third_party/notices/ 下的上游许可声明原文，每份一个 precedence = "override" 的块：
# 以块里写的为准，原文里 "Copyright notice:" 一类字样不是版权行。声明入库时在此加块。
# 同目录的 README.md 是本仓写的来源表，归兜底块，所以这里按文件名前缀逐个登记，不用目录通配。
# THIRD-PARTY-NOTICES.md 是本仓自己写的，但正文引用了上游的版权行；用 override 让 REUSE 不把引文当成它的版权。
[[annotations]]
path = "THIRD-PARTY-NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "third_party/notices/juce.*"
precedence = "override"
SPDX-FileCopyrightText = "Raw Material Software Limited"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "third_party/notices/vst3sdk.*"
precedence = "override"
SPDX-FileCopyrightText = "2024 Steinberg Media Technologies GmbH"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "third_party/notices/vst3sdk-base.*"
precedence = "override"
SPDX-FileCopyrightText = "2024 Steinberg Media Technologies GmbH"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/notices/audiounitsdk.*"
precedence = "override"
SPDX-FileCopyrightText = "2000-2021 Apple Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third_party/notices/zlib.*"
precedence = "override"
SPDX-FileCopyrightText = "1995-2022 Jean-loup Gailly and Mark Adler"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "third_party/notices/libpng.*"
precedence = "override"
SPDX-FileCopyrightText = [
  "1995-2019 The PNG Reference Library Authors",
  "2018-2019 Cosmin Truta",
  "2000-2002, 2004, 2006-2018 Glenn Randers-Pehrson",
  "1996-1997 Andreas Dilger",
  "1995-1996 Guy Eric Schalnat, Group 42, Inc.",
]
SPDX-License-Identifier = "libpng-2.0"

[[annotations]]
path = "third_party/notices/libjpeg.*"
precedence = "override"
SPDX-FileCopyrightText = "1991-1998 Thomas G. Lane"
SPDX-License-Identifier = "IJG"

[[annotations]]
path = "third_party/notices/harfbuzz.*"
precedence = "override"
SPDX-FileCopyrightText = "HarfBuzz authors (full list in third_party/notices/harfbuzz.COPYING)"
SPDX-License-Identifier = "MIT-Modern-Variant"

[[annotations]]
path = "third_party/notices/sheenbidi.*"
precedence = "override"
SPDX-FileCopyrightText = "2014-2022 Muhammad Tayyab Akram"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third_party/notices/unicode.*"
precedence = "override"
SPDX-FileCopyrightText = "1991-2026 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

[[annotations]]
path = "third_party/notices/webview2.*"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/notices/catch2.*"
