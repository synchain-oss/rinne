SPDX-FileCopyrightText = "Catch2 Authors"
SPDX-License-Identifier = "BSL-1.0"

[[annotations]]
path = "third_party/notices/space-grotesk.*"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors (https://github.com/floriankarsten/space-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
