#
# 格式与文档真源（required checks：clang-format、docs-truth）。不编译，各自几十秒。
#   clang-format  钉版 clang-format 查 C++ 源（还没有 src/ 时跳过；有 src/ 却列不出源文件判红），
#                 钉版 prettier 查其余格式，命令与本机 gates 逐字相同
#   docs-truth    run-checks 的 docs 组：workflow 加固与 actionlint、action 锁、required checks、钉版文件
name: Format

on:
  pull_request:
    branches: [dev, prod, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, prod, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    # 钉 24.04、不跟 ubuntu-latest：与同一 workflow 里装钉版 Python 工具的 job 用同一个镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned clang-format
        run: pipx install "clang-format==$(tr -d '[:space:]' < .clang-format-version)"
      - name: C++ formatting
        run: |
          set -euo pipefail
          check() {
            if [ ! -d "$1/src" ]; then echo "跳过：尚无 C++ 源"; return 0; fi
            git -C "$1" ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.mm' | grep -zv '^third_party/' > "$RUNNER_TEMP/cxx" || true
            if [ ! -s "$RUNNER_TEMP/cxx" ]; then echo "::error::src/ 存在，却没有列出任何 C++ 源文件"; return 1; fi
            (cd "$1" && xargs -0 clang-format --dry-run --Werror --style=file < "$RUNNER_TEMP/cxx")
          }
          # 自测：有 src/ 但清单为空的夹具必须判红，免得清单写坏后静默放行
          fixture=$(mktemp -d)
          git -C "$fixture" init -q
          mkdir "$fixture/src"
          echo x > "$fixture/src/README.md"
          git -C "$fixture" add -A
          if check "$fixture" > /dev/null 2>&1; then echo "::error::自测失败：空清单的夹具没有判红"; exit 1; fi
          check .
      - name: Prettier
        run: npx --yes "prettier@$(tr -d '[:space:]' < .prettier-version)" --check .

  docs-truth:
    name: docs-truth
    # 钉 24.04、不跟 ubuntu-latest：换镜像就换了系统 Python，pip 按它挑 wheel；requirements-tools.txt 的哈希按平台登记（brotli 只有 cp312 manylinux 一份），26.04 的 3.14 上对不上
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # actionlint_<版本>_linux_amd64.tar.gz 的 sha256，取自该版本官方的 checksums.txt；升版本时一起改
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < .actionlint-version)
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${v}/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "RINNE_ACTIONLINT=$RUNNER_TEMP/actionlint/actionlint" >> "$GITHUB_ENV"
      - name: Install pinned font tools (fontTools, brotli)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          # 只取 requirements-tools.txt 里 fonttools 与 brotli 两条（版本行加上以 \ 续接的哈希行），按哈希装，只收 wheel
          awk '/^(fonttools|brotli)==/{p=1} p{print; if (substr($0, length($0)) != "\\") p=0}' requirements-tools.txt \
            > "$RUNNER_TEMP/font-tools.txt"
          "$RUNNER_TEMP/py/bin/pip" install --disable-pip-version-check -q --require-hashes --no-deps --only-binary=:all: \
            -r "$RUNNER_TEMP/font-tools.txt"
          echo "RINNE_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"
      - name: Self-test
        run: node scripts/run-checks.mjs --group docs --self-test
      - name: Docs truth
        run: node scripts/run-checks.mjs --group docs
