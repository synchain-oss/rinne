# SPDX-License-Identifier: GPL-3.0-or-later
#
# 合规（required check：compliance）。工作树：gitleaks、reuse lint、SPDX 头、隐私扫描（先跑全部自测）。
# PR 上另对 BASE..HEAD 逐提交跑 gitleaks 与隐私扫描：推上来的提交经 refs/pull 已经公开，这一步是事后告警，
# 命中后关 PR、删分支，由维护者联系 GitHub 清理，换新分支重开。推送到长期分支时按推送兜底档复核新提交。
# 同仓 PR 与 push 用 secret 里的个人针（--needles ci，缺了判红）；fork PR 读不到 secret，只跑通用规则。
name: Compliance

on:
  pull_request:
    branches: [dev, prod, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, prod, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEEDLES: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'ci' || 'ci-optional' }}
      # gitleaks_<版本>_linux_x64.tar.gz 的 sha256，取自该版本官方的 checksums.txt；升版本时一起改
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned tools (gitleaks, reuse)
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < .gitleaks-version)
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "RINNE_GITLEAKS=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --disable-pip-version-check -q -r requirements-tools.txt
          echo "RINNE_REUSE=$RUNNER_TEMP/py/bin/reuse" >> "$GITHUB_ENV"
      - name: Self-test
        run: node scripts/run-checks.mjs --group compliance --self-test
      - name: Worktree (privacy, SPDX, REUSE)
        env:
          PRIVACY_NEEDLES: ${{ secrets.PRIVACY_NEEDLES }}
        run: node scripts/run-checks.mjs --group compliance --needles "$NEEDLES"
      - name: Worktree secrets
        run: '"$RINNE_GITLEAKS" dir . --no-banner --redact'
      - name: Pull request commits (secrets and privacy)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRIVACY_NEEDLES: ${{ secrets.PRIVACY_NEEDLES }}
        run: |
          set -euo pipefail
          "$RINNE_GITLEAKS" git . --no-banner --redact --log-opts="$BASE_SHA..$HEAD_SHA --no-ext-diff --no-textconv"
          node scripts/check-privacy.mjs --commits --no-messages --needles "$NEEDLES" "$BASE_SHA..$HEAD_SHA"
      - name: Pushed commits (fallback tier)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PRIVACY_NEEDLES: ${{ secrets.PRIVACY_NEEDLES }}
        run: |
          set -euo pipefail
          "$RINNE_GITLEAKS" git . --no-banner --redact --log-opts="$BEFORE..$AFTER --no-ext-diff --no-textconv"
          node scripts/check-privacy.mjs --commits --no-messages --needles "$NEEDLES" "$BEFORE..$AFTER"
          node scripts/check-commits.mjs commits --range "$BEFORE..$AFTER" --tier push --needles "$NEEDLES"
