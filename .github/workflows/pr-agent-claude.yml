# SPDX-License-Identifier: GPL-3.0-or-later
#
# 交叉验证用的第二个 pr-agent：Claude Haiku 5.5（effort high），走 Claude API credit（org secret
# CLAUDE_API_KEY_FOR_PR_REVIEW），按量计费。所有 base 的 PR 都跑，PR 每次推送都重跑；晋升 PR（dev → prod）、draft、
# fork 与 bot 的 PR 由被调用方跳过。只发评论：不是 required check，不进合并判据。
# describe: false：describe 会把生成的段落接在 PR 正文后面，而本仓 PR 正文的最后一行必须是签名行（branch-gate 与
# pr-merge 都核对），所以哪个 base 都不跑。review_labels: false：不打 Review effort / Possible security concern
# 标签（标签以 .github/labels.json 为唯一真源）。secondary_on_bases 是 OpenCode Go 那个 pr-agent 跑的 base（dev）：
# 两者共用一个评论身份，在 dev 上两个都每次推送发新评论（那边设了 persistent_comments: false），互不覆盖；
# 其他 base 上只有这一个 pr-agent，评论原地更新。
# 引用钉 40 位 SHA、行尾注明 tag；改 SHA 时重跑 node scripts/lock-actions.mjs。
name: PR Agent (Claude Haiku)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent-claude:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Synchain-oss/ci-workflows/.github/workflows/pr-agent.yml@8028e34628bc2276ca978d87ccfc364432742820 # v1.3.1
    with:
      provider: anthropic
      base_branches: '["*"]'
      secondary_on_bases: '["dev"]'
      describe: false
      review_labels: false
      # 与 pr-agent.yml 保持一致
      ignore_globs: '["scripts/probe/fixtures/**", "scripts/maintainer/fixtures/**", "web/fonts/**", "web/js/juce/**", "LICENSES/**", "third_party/notices/**"]'
    secrets:
      api_key: ${{ secrets.CLAUDE_API_KEY_FOR_PR_REVIEW }}
