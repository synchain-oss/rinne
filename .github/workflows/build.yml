# SPDX-License-Identifier: GPL-3.0-or-later
# Derived from synchain-oss/scvb; see upstream/build.json
#
# 完整构建（dev / prod 的 required check：build-win）。三种模式共用这一套 job，只按 MODE 分支：
#   pr        PR → dev / prod。子 PR（→ feature/**）不跑本 workflow，这是有意的：子 PR 的编译门是本机 gates
#   dispatch  workflow_dispatch：ref = 要构建的 40 位提交（scripts/maintainer/dispatch.ps1 按 sha 触发），probe = 另出探针身份
#   release   被 release.yml 以 workflow_call 调用，构建 release-tag 指向的提交
# build-win 的配置、构建与验证都调 scripts/build.ps1，与本机 gates、合并后构建同一份配方：MSVC 环境、第一方零 warning、
# 恰好两个插件（按名字，探针身份另算）、ctest、pluginval strictness 5 无 GUI；另外断言 cache 里的段名前缀是默认值。
# 钉版：JUCE 按 .juce-version 的 tag 浅克隆，CMake 守卫再断言它就是 .juce-commit；ninja 与 pluginval 由 bootstrap-tools.ps1
# 按 sha256 装；sccache 按 .sccache-version 与 .sccache-sha256 装；WebView2 包由 CMake 按 sha256 取。
# artifact：Rinne-win64-{pr<N>|dispatch}-<sha40>（release 为 Rinne-release-win64-<tag>），两个插件在顶层，tools-bin 下有
# 可执行文件时放进 tools/；探针另传 Rinne-probe-win64-<sha40>。<sha40> 一律是实际检出、构建的那个提交。
# build-mac（macos-15、arm64 原生）：配置、构建、ctest，零分配计数器的反例，bundle 身份（2 个 .vst3 + 2 个 .component），
# ad-hoc 签名与 codesign --verify，auval ×2 与 auval -a 唯一性，pluginval ×4，前后各一次共享内存残段检查，进程外自测（非门禁），
# arm64 压测与变异构建。判据都在 scripts/ci/mac/，每个有自测。artifact：Rinne-macos-arm64-{pr<N>|dispatch}-<sha40>
# （release 为 Rinne-release-macos-arm64-<tag>），里面是 ditto 打的 zip；probe 另出 universal 的 Rinne-probe-macos-universal-<sha40>。
# core-sanitizers（ubuntu、clang-18、RINNE_CORE_ONLY=ON）：asan_ubsan 与 tsan 两个配置各自配置、构建、跑全部 ctest；不需要 JUCE。
# web-smoke：web-preview/tests/run-all.mjs 存在就跑，不存在时打印 SKIP 注记并通过（页面冒烟随 web 预览一起到）。
# 这四个 job 的名字就是 dev / prod ruleset 里 required check 的 context（见 .github/required-checks.json），不要改名，也不要加 job 级 if。
# run-name：`Build & Validate <事件> <40 位提交> <nonce>`。dispatch.ps1 给每次触发带一个随机 nonce，靠它在 run-name 里精确认出
# 自己触发的那次运行；nonce 没给时末尾就是空的。
# concurrency：PR 按 PR 号分组、新推送取消旧的；dispatch 与 release 按提交分组、不取消，每次运行都对应确定的一次提交。
name: Build & Validate
run-name: Build & Validate ${{ github.event_name }} ${{ inputs.ref || github.sha }} ${{ inputs.nonce }}

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的提交（40 位 sha）；空着就构建所选分支的 tip
        required: false
        type: string
      probe:
        description: 另外构建探针身份并上传
        required: false
        type: boolean
        default: false
      nonce:
        description: 随机串，只用来让 dispatch.ps1 在 run-name 里认出自己触发的那次运行；可以不填
        required: false
        type: string
  workflow_call:
    inputs:
      release-tag:
        description: 要构建的 tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || inputs.ref || inputs.release-tag || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-win:
    name: build-win
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      JUCE_DIR: ${{ github.workspace }}\JUCE
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      # 一次冷编的缓存约 100 MiB；上限给大了它就长到多大，挤掉别的缓存条目
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-tag || '' }}
          persist-credentials: false

      - name: Mode and names
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WANT_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          NONCE: ${{ inputs.nonce }}
        run: |
          # nonce 只进 run-name，这里仍限死字符集：不让任何不可信文本流进后面的步骤
          if ($env:NONCE -and $env:NONCE -notmatch '^[0-9A-Za-z._-]{1,64}$') { Write-Error 'nonce 只能是 1 到 64 个字母、数字、点、下划线或连字符'; exit 1 }
          $sha = "$(git rev-parse HEAD)".Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { Write-Error '取不到检出的提交'; exit 1 }
          # ref 只收 40 位提交号：分支名、tag、短 sha 都会变，构建与 concurrency 组就对应不到确定的提交
          if ($env:WANT_REF -and $env:WANT_REF -notmatch '^[0-9a-f]{40}$') { Write-Error 'ref 必须是 40 位提交号（空着就构建所选分支的 tip）'; exit 1 }
          if ($env:WANT_REF -and $env:WANT_REF -ne $sha) { Write-Error "检出的是 $sha，不是要构建的 $env:WANT_REF"; exit 1 }
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { Write-Error 'release-tag 不是 vX.Y.Z[-后缀] 的形式'; exit 1 }
            $mode, $name, $keep = 'release', "Rinne-release-win64-$($env:RELEASE_TAG)", 7
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PR_NUMBER -notmatch '^\d+$') { Write-Error '取不到 PR 号'; exit 1 }
            $mode, $name, $keep = 'pr', "Rinne-win64-pr$($env:PR_NUMBER)-$sha", 14
          } else {
            $mode, $name, $keep = 'dispatch', "Rinne-win64-dispatch-$sha", 30
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if ($msvc -notmatch '^[\d.]+$') { Write-Error "取不到 MSVC 工具集版本：$msvc"; exit 1 }
          Write-Host "mode=$mode sha=$sha artifact=$name msvc=$msvc"
          @("MODE=$mode", "BUILT_SHA=$sha", "ARTIFACT=$name", "RETENTION=$keep", "PROBE_ARTIFACT=Rinne-probe-win64-$sha",
            "JUCE_TAG=$((Get-Content .juce-version -Raw).Trim())", "MSVC_VER=$msvc") | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JUCE_DIR }}
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-commit') }}

      - name: Clone JUCE (pinned tag)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --quiet --depth 1 --branch "$env:JUCE_TAG" https://github.com/juce-framework/JUCE.git "$env:JUCE_DIR"

      - name: Restore WebView2 package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/packages
          key: webview2-${{ hashFiles('cmake/RinneDeps.cmake') }}

      - name: Install pinned ninja and pluginval
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rinne-tools'
          pwsh -NoProfile -File scripts/bootstrap-tools.ps1 -ToolsDir $dir -Tools ninja,pluginval
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ninja = Get-ChildItem -LiteralPath $dir -Filter ninja.exe -File -Recurse | Select-Object -First 1
          $pv = Get-ChildItem -LiteralPath $dir -Filter pluginval.exe -File -Recurse | Select-Object -First 1
          if (-not $ninja -or -not $pv) { Write-Error '装好后找不到 ninja.exe 或 pluginval.exe'; exit 1 }
          @("RINNE_NINJA=$($ninja.FullName)", "RINNE_PLUGINVAL=$($pv.FullName)") | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned sccache
        run: |
          $ver = (Get-Content .sccache-version -Raw).Trim()
          $want = (Get-Content .sccache-sha256 -Raw).Trim().ToLowerInvariant()
          $name = "sccache-v$ver-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/v$ver/$name.zip" -OutFile $zip
          $got = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { Write-Error "sccache 的 sha256 不符：期望 $want，实际 $got"; exit 1 }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $exe = Join-Path $env:RUNNER_TEMP "sccache\$name\sccache.exe"
          if (-not (Test-Path -LiteralPath $exe)) { Write-Error '解开后没有 sccache.exe'; exit 1 }
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          "RINNE_SCCACHE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # 键里带 MSVC 工具集与构建脚本的哈希：换了它们旧对象多半不命中，换一把键重新长。键尾的 run_id 让每次都写回，
      # 下一次靠 restore-keys 的前缀捞到上一次的那份。
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ env.MSVC_VER }}-${{ hashFiles('.juce-commit', 'CMakeLists.txt', 'cmake/*.cmake', 'src/**/CMakeLists.txt', 'src/**/sources-*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.MSVC_VER }}-${{ hashFiles('.juce-commit', 'CMakeLists.txt', 'cmake/*.cmake', 'src/**/CMakeLists.txt', 'src/**/sources-*.cmake') }}-
            sccache-${{ runner.os }}-${{ env.MSVC_VER }}-

      - name: Build
        run: pwsh -NoProfile -File scripts/build.ps1 -Ci -JucePath "$env:JUCE_DIR" -Launcher "$env:RINNE_SCCACHE"

      - name: Shared-memory prefix is the default
        run: pwsh -NoProfile -File scripts/build.ps1 -CheckCache

      # 构建出来的 .vst3 里 moduleinfo.json 的 CID、名称、厂商、子类与版本，要和 tests/golden/identity.json 对得上
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: VST3 identity matches the golden
        run: node scripts/checks.d/contract-static-identity.mjs --moduleinfo build

      # sccache 失效时是静默的零命中，CI 照样绿、只是慢回冷编；打印命中率，顺手停掉服务让索引落盘
      - name: Compiler cache stats
        if: always()
        run: |
          if (-not $env:RINNE_SCCACHE -or -not (Test-Path -LiteralPath $env:RINNE_SCCACHE)) { Write-Host 'sccache 没有装上'; exit 0 }
          & $env:RINNE_SCCACHE --show-stats
          & $env:RINNE_SCCACHE --stop-server | Out-Host
          exit 0

      - name: ctest
        run: pwsh -NoProfile -File scripts/build.ps1 -Ci -NoBuild -Test

      - name: pluginval (strictness 5, no GUI)
        run: pwsh -NoProfile -File scripts/build.ps1 -Ci -NoBuild -Validate

      - name: Stage
        run: pwsh -NoProfile -File scripts/build.ps1 -Ci -NoBuild -Stage (Join-Path $env:RUNNER_TEMP 'dist')

      - name: Upload plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      - name: Build probe identity
        if: inputs.probe
        run: |
          pwsh -NoProfile -File scripts/build.ps1 -Ci -Probe -JucePath "$env:JUCE_DIR" -Launcher "$env:RINNE_SCCACHE"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/build.ps1 -CheckCache -Probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/checks.d/contract-static-identity.mjs --moduleinfo build-probe --probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/build.ps1 -Ci -Probe -NoBuild -Validate -Stage (Join-Path $env:RUNNER_TEMP 'dist-probe')

      - name: Upload probe plugins
        if: inputs.probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROBE_ARTIFACT }}
          path: ${{ runner.temp }}/dist-probe
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rinne-win64-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/logs
            build-probe/logs
          if-no-files-found: ignore
          retention-days: 7

  # mac 构建（macos-15，arm64 原生）。配置、构建、验证的判据都在 scripts/ci/mac/ 的脚本里，那里每个判据有自测，本 job 一开头先跑一遍。
  # 阶段：构建与 ctest（含 TIMEOUT 门禁、免 DAW 宿主测试）→ 零分配计数器的反例 → bundle 身份（2 个 .vst3 + 2 个 .component、
  # 架构、minos、AU 三元组）→ ad-hoc 签名与 codesign --verify → 上传 → 残段检查 → 装 AU、auval ×2、auval -a 唯一性、
  # pluginval ×4（不开 GUI）→ 残段检查 → 进程外自测（非门禁）→ arm64 压测与变异构建 →（probe）探针 universal。
  # 后面的步骤都用 !cancelled() 加前置步骤的结论判断，前面红了也尽量把能看的都跑出来；job 的结论仍然是任何一步红即红。
  # 压测与变异构建：rinne_stress 存在时自动生效，不存在时打印 SKIP 并通过；进程外自测（mac-au-oop）是 continue-on-error，release 时跳过。
  build-mac:
    name: build-mac
    runs-on: macos-15
    timeout-minutes: 90
    env:
      JUCE_DIR: ${{ github.workspace }}/JUCE
      # 部署目标的唯一真源是 cmake/RinneMac.cmake；check-cache.sh 从 CMakeCache 读回来断言它就是 11.0
      MINOS: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-tag || '' }}
          persist-credentials: false

      - name: Mode and names
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WANT_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          # nonce 只进 run-name，这里仍限死字符集：不让任何不可信文本流进后面的步骤
          if [ -n "$NONCE" ] && ! printf '%s' "$NONCE" | grep -Eq '^[0-9A-Za-z._-]{1,64}$'; then echo '::error::nonce 只能是 1 到 64 个字母、数字、点、下划线或连字符'; exit 1; fi
          sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then echo '::error::取不到检出的提交'; exit 1; fi
          # ref 只收 40 位提交号：分支名、tag、短 sha 都会变，构建与 concurrency 组就对应不到确定的提交
          if [ -n "$WANT_REF" ] && ! printf '%s' "$WANT_REF" | grep -Eq '^[0-9a-f]{40}$'; then echo '::error::ref 必须是 40 位提交号（空着就构建所选分支的 tip）'; exit 1; fi
          if [ -n "$WANT_REF" ] && [ "$WANT_REF" != "$sha" ]; then echo "::error::检出的是 $sha，不是要构建的 $WANT_REF"; exit 1; fi
          if [ -n "$RELEASE_TAG" ]; then
            if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then echo '::error::release-tag 不是 vX.Y.Z[-后缀] 的形式'; exit 1; fi
            mode=release; name="Rinne-release-macos-arm64-$RELEASE_TAG"; keep=7
          elif [ "$EVENT_NAME" = pull_request ]; then
            if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then echo '::error::取不到 PR 号'; exit 1; fi
            mode=pr; name="Rinne-macos-arm64-pr$PR_NUMBER-$sha"; keep=14
          else
            mode=dispatch; name="Rinne-macos-arm64-dispatch-$sha"; keep=30
          fi
          echo "mode=$mode sha=$sha artifact=$name"
          {
            echo "MODE=$mode"
            echo "BUILT_SHA=$sha"
            echo "ARTIFACT=$name"
            echo "RETENTION=$keep"
            echo "PROBE_ARTIFACT=Rinne-probe-macos-universal-$sha"
            echo "JUCE_TAG=$(tr -d '[:space:]' < .juce-version)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Gate script self-tests
        run: bash scripts/ci/mac/selftest.sh

      - name: Record toolchain
        run: |
          set -uo pipefail
          arch=$(uname -m)
          if [ "$arch" != arm64 ]; then echo "::error::期望 arm64 的 runner，实际是 $arch"; exit 1; fi
          sw_vers
          xcodebuild -version
          clang --version
          cmake --version | head -n 1
          pwsh --version || echo 'pwsh 不在 PATH 上'
          {
            echo "### build-mac"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`$BUILT_SHA\` |"
            echo "| 系统 | macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)) $arch |"
            echo "| Xcode | $(xcodebuild -version | tr '\n' ' ') |"
            echo "| clang | $(clang --version | head -n 1) |"
            echo "| cmake | $(cmake --version | head -n 1) |"
            echo "| JUCE | $JUCE_TAG |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JUCE_DIR }}
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-commit') }}

      - name: Clone JUCE (pinned tag)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --quiet --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$JUCE_DIR"

      - name: Ensure Ninja
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          ninja --version
          echo "| ninja | $(ninja --version)（runner 自带或 brew，未钉版） |" >> "$GITHUB_STEP_SUMMARY"

      # 架构与部署目标不在命令行传：它们的唯一真源是 cmake/RinneMac.cmake，下一步从 CMakeCache 读回来核，传了就证明不了它在起作用。
      # CMAKE_COLOR_DIAGNOSTICS=OFF：诊断行里夹进颜色码，日志里的告警就认不出来了。
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$JUCE_DIR" -DCMAKE_COLOR_DIAGNOSTICS=OFF

      - name: Architecture, deployment target and shared-memory prefix are the defaults
        run: bash scripts/ci/mac/check-cache.sh build formal

      # 第一方源码是告警即错误（rinne_warnings_as_errors），所以这一步绿就是第一方零 warning
      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: ctest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # 零分配计数器的反例：计数器对 malloc、calloc、realloc、free 之一视而不见时，对应用例必须变红
      - name: Allocation counter canaries must fire
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          exe=$(find build -type f -name rinne_host_tests -perm -u+x -not -path '*/_deps/*' -print -quit)
          if [ -z "$exe" ]; then echo '::error::找不到 rinne_host_tests'; exit 1; fi
          bash scripts/ci/mac/alloc-canary.sh "$exe"

      # 构建出来的 .vst3 里 moduleinfo.json 的 CID、名称、厂商、子类与版本，要和 tests/golden/identity.json 对得上
      - name: VST3 identity matches the golden
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/checks.d/contract-static-identity.mjs --moduleinfo build

      - name: Bundles (2 VST3 + 2 AU, arm64, minos, AU triples)
        id: bundles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci/mac/check-bundles.mjs --build build --minos "$MINOS" --list bundles.txt --triples triples.txt

      - name: ad-hoc signature verifies (and the controls turn red)
        id: sign
        if: ${{ !cancelled() && steps.bundles.outcome == 'success' }}
        run: bash scripts/ci/mac/sign-and-verify.sh bundles.txt

      # 上传的是 ditto 打的 zip：upload-artifact 会丢可执行位和符号链接，bundle 里的签名就对不上了
      - name: Stage
        id: stage
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          while IFS= read -r b; do ditto -c -k --keepParent "$b" "$dist/$(basename "$b").zip"; done < bundles.txt
          ls -l "$dist"

      - name: Upload plugins
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      - name: Shared-memory leftovers before validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/ci/mac/shm-leftover.sh build before

      - name: Install AU components
        id: au_install
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        run: bash scripts/ci/mac/au-gate.sh install bundles.txt au-installed.txt

      - name: auval -v (aufx Rnni Snch, aufx Rnno Snch)
        id: auval
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/ci/mac/au-gate.sh validate triples.txt ci-logs/auval

      - name: auval -a lists each triple exactly once
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        run: bash scripts/ci/mac/au-gate.sh unique triples.txt ci-logs/auval

      - name: pluginval x4 (strictness 5, no GUI)
        id: pluginval
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        timeout-minutes: 20
        run: bash scripts/ci/mac/pluginval-gate.sh bundles.txt au-installed.txt ci-logs/pluginval

      - name: Shared-memory leftovers after validation
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        run: bash scripts/ci/mac/shm-leftover.sh build after

      # 进程外自测：不是门禁，红了只在 summary 里留痕；release 时跳过，mac 的失败不挡发布
      - name: mac-au-oop (AUHostingService, not a gate)
        id: oop
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' && !inputs.release-tag }}
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/ci/mac/oop-run.sh triples.txt build-oop

      # 压测与变异构建：core-only，不需要 JUCE。rinne_stress 不存在时打印 SKIP 并通过
      - name: Stress (arm64) and mutation builds must turn red
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: bash scripts/ci/mac/stress.sh build-stress

      - name: Build probe identity (universal)
        id: probe
        if: ${{ !cancelled() && inputs.probe }}
        run: |
          set -euo pipefail
          cmake -S . -B build-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$JUCE_DIR" -DRINNE_PROBE_BUILD=ON -DCMAKE_COLOR_DIAGNOSTICS=OFF
          bash scripts/ci/mac/check-cache.sh build-probe probe
          cmake --build build-probe --parallel
          node scripts/checks.d/contract-static-identity.mjs --moduleinfo build-probe --probe
          node scripts/ci/mac/check-bundles.mjs --build build-probe --minos "$MINOS" --probe --list probe-bundles.txt
          bash scripts/ci/mac/sign-and-verify.sh probe-bundles.txt
          dist="$RUNNER_TEMP/dist-probe"
          rm -rf "$dist"
          mkdir -p "$dist"
          while IFS= read -r b; do ditto -c -k --keepParent "$b" "$dist/$(basename "$b").zip"; done < probe-bundles.txt
          ls -l "$dist"

      - name: Upload probe plugins
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROBE_ARTIFACT }}
          path: ${{ runner.temp }}/dist-probe
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rinne-macos-arm64-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs
            build/Testing
          if-no-files-found: ignore
          retention-days: 7

  # sanitizer 只作用于 rinne_core 与它的测试（RINNE_SANITIZE 经 rinne_core 的 PUBLIC 选项传给测试），所以不需要 JUCE，Linux 上就能跑。
  # 两个配置在同一个 job 里依次跑：required check 的 context 是 job 名，矩阵会把名字变成 core-sanitizers (asan_ubsan)。
  # ctest 里包含 TIMEOUT 门禁（ctest_timeouts_*），缺 TIMEOUT 的测试在这里同样会变红。
  core-sanitizers:
    name: core-sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-tag || '' }}
          persist-credentials: false

      - name: Checked-out commit is the requested one
        env:
          WANT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "$WANT_REF" ] && ! printf '%s' "$WANT_REF" | grep -Eq '^[0-9a-f]{40}$'; then echo 'ref 必须是 40 位提交号' >&2; exit 1; fi
          if [ -n "$WANT_REF" ] && [ "$WANT_REF" != "$sha" ]; then echo "检出的是 $sha，不是要构建的 $WANT_REF" >&2; exit 1; fi
          echo "sha=$sha"

      # GitHub 的 Ubuntu 24.04 镜像把 mmap 随机化放到 32 位，clang 18 的 sanitizer 在这种布局下起不来（unexpected memory mapping）
      - name: Lower mmap entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Toolchain
        run: |
          set -euo pipefail
          clang++-18 --version
          cmake --version
          pwsh --version

      - name: asan_ubsan
        run: |
          set -euo pipefail
          cmake -S . -B build-asan_ubsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DRINNE_CORE_ONLY=ON -DRINNE_SANITIZE=asan_ubsan
          cmake --build build-asan_ubsan --parallel
          ctest --test-dir build-asan_ubsan --output-on-failure --no-tests=error

      # 金丝雀：故意有问题的小程序必须被拦住，否则上面的绿不可信（脚本里每个程序不报就失败）
      - name: asan_ubsan canaries must fire
        run: bash tests/sanitizer-canary/run.sh asan_ubsan

      - name: tsan
        run: |
          set -euo pipefail
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DRINNE_CORE_ONLY=ON -DRINNE_SANITIZE=tsan
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure --no-tests=error

      - name: tsan canary must fire
        run: bash tests/sanitizer-canary/run.sh tsan

  # 页面冒烟。web-preview/tests/run-all.mjs 随 web 预览到位之前不存在，此时打印 SKIP 注记并通过；到位之后它就是门禁本身。
  web-smoke:
    name: web-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-tag || '' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Web smoke
        run: |
          set -euo pipefail
          if [ ! -f web-preview/tests/run-all.mjs ]; then
            echo '::notice title=web-smoke::SKIP: web-preview/tests/run-all.mjs does not exist yet, nothing to run'
            exit 0
          fi
          node web-preview/tests/run-all.mjs
