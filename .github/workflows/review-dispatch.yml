# SPDX-License-Identifier: GPL-3.0-or-later
#
# 维护者在 PR 上评论 /review，显式触发一次 Claude 审查（check 名 dispatch）。这是 fork PR 唯一的 AI 审查通道：
# claude-review.yml 只跑同仓 PR，而向 fork PR 供密的事件触发一律不用。
# issue_comment 事件用的永远是默认分支（dev）上的这份文件，所以 v1 合进 dev 之后才生效，改这里也要合到 dev 才算数。
#
# 本 job 带着 secret 跑，所以全程不签出 PR 的代码：工作区是 PR 的目标分支（本仓分支，只有维护者能写），
# 脚本、prompt 与 claude_args 也都取自目标分支；PR 的改动只以文本交给模型当数据读。
# PR 一旦改了 .github/workflows/ 或 .github/actions/ 就中止，改由维护者本地人工审：改 workflow 的 PR
# 不该只凭一次 AI 审查放行（本 job 不执行 PR 里的 workflow，这是纵深防御）。
name: Review Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# 只有「会真的跑审查」的评论共用一个组；其他评论（bot 回帖、普通讨论）各占一个组。若所有评论共用一个组，
# 审查跑着的时候 PR 上任何一条新评论都会把它取消：被 if 跳过的 run 一样占组、一样触发 cancel-in-progress。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && 'review' || github.event.comment.id }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch
    # 三条缺一不可，否则这条通道会变成任意外部用户可触发的供密面：
    #   1. 必须是 PR 上的评论（issue_comment 在普通 issue 上也触发）；
    #   2. 评论以 /review 开头（startsWith，不用 contains：引用这个字符串的普通评论会误触）；
    #   3. 评论者是 OWNER / MEMBER / COLLABORATOR。显式排除 CONTRIBUTOR：它只表示「曾有提交被合入」，
    #      fork PR 的作者第二次提 PR 时就是它。
    # 上面 concurrency 的组名抄了同一组条件，改这里要一起改。
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Claude Code 单个 API 请求默认 10 分钟就放弃重来；放宽到 15 分钟（与 Synchain-oss/ci-workflows 一致），
    # 长回复不会被中途丢掉重算。写在 job 级，action 的步骤从这里继承。
    # 取舍：一次请求停滞要等满 15 分钟才会重试，所以审查步骤的超时必须容得下两次，再留一点余量；
    # 失败只是浪费一次重跑，比把还能重试的审查提前掐掉、逼维护者再 /review 一次要好。
    env:
      API_TIMEOUT_MS: "900000"
    steps:
      - name: Ack
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "已收到 /review，开始审查。"

      # base 与 head 只在这里解析一次（同一次 API 调用，彼此一致）：后面的文件列表、diff、head 标记都钉在这两个提交上，
      # 审查期间再有推送也混不进来，发总结前再核一次 head。baseRefName 一定是本仓的分支，下面签出它，不是 PR head。
      - name: Resolve PR base and head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          out=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName,baseRefOid,headRefOid \
            --jq '"\(.baseRefName) \(.baseRefOid) \(.headRefOid)"')
          read -r base base_sha head <<< "$out"
          [ -n "$base" ] || { echo "::error::cannot resolve the base branch of PR #$PR"; exit 1; }
          for sha in "$base_sha" "$head"; do
            case "$sha" in *[!0-9a-f]* | '') echo "::error::unexpected sha: '$sha'"; exit 1 ;; esac
            [ "${#sha}" = 40 ] || { echo "::error::unexpected sha: '$sha'"; exit 1; }
          done
          { echo "base=$base"; echo "base_sha=$base_sha"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      # 文件列表取自钉住的 base...head，改名的文件连原路径一起查（把 workflow 挪出 .github/ 也算改了 workflow）。
      # compare 接口最多列 300 个文件：按 .files 的条数判断，列满时核对不完，按「改了 workflow」处理。
      # 文件名是 PR 可控的文本，回显时停掉 workflow 命令解析。回帖成功后留标记文件，末尾的失败回帖见到它就不再重复。
      - name: Abort if the PR touches workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          cmp="$RUNNER_TEMP/compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$cmp"
          n=$(jq '.files | length' "$cmp")
          files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' "$cmp")
          stop=$(openssl rand -hex 16)
          echo "::stop-commands::$stop"
          printf '%s\n' "$files"
          echo "::$stop::"
          reason=""
          if [ "$n" -ge 300 ]; then
            reason="该 PR 改动的文件达到比较接口能列出的上限（300 个），核对不了有没有改 workflow"
          elif printf '%s\n' "$files" | grep -qE '^\.github/(workflows|actions)/'; then
            reason="该 PR 修改了 .github/workflows/ 或 .github/actions/"
          fi
          if [ -n "$reason" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "$reason，按安全策略不能通过 /review 审查，请维护者本地拉分支人工审。" &&
              touch "$RUNNER_TEMP/review-dispatch-reported"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 必须排在 checkout 之后（checkout 会清掉工作区里未跟踪的文件）。diff 钉在上面解析出的 base...head 上。
      # 符号链接检查这里查的是目标分支的索引：PR 自带的链接不会落到磁盘上，只以文本出现在 pr.diff 里。
      - name: Prepare PR context for the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: >-
          node scripts/review-bot.mjs prepare --pr "$PR" --repo "$GITHUB_REPOSITORY"
          --base "$BASE_SHA" --head "$HEAD_SHA"

      # prompt 与 claude_args 取自刚签出的目标分支上的 claude-review.yml，并在最前面加上「本次不签出 PR 代码」的前提。
      # 结构核对不过（缺不可信数据声明、--tools 白名单、--disallowedTools 黑名单，或有 Bash 放行规则）就判红。
      - name: Load prompt and claude_args from claude-review.yml
        id: cfg
        env:
          PR: ${{ github.event.issue.number }}
          BASE: ${{ steps.pr.outputs.base }}
        run: node scripts/review-bot.mjs config --pr "$PR" --repo "$GITHUB_REPOSITORY" --dispatch-base "$BASE" --output "$GITHUB_OUTPUT"

      # 不开 track_progress：在 issue_comment 上它会把 action 切到 tag 模式，而 tag 模式会自己签出 PR head、
      # 追加改文件与 git 的工具，正是这里要避开的。给了 prompt 就是 agent 模式，不切分支。
      # base_branch：action 从这个分支还原 CLAUDE.md、.claude/ 等配置，不传就取默认分支，会和上面签出的目标分支对不上。
      # 35 分钟 = 两次 15 分钟的 API 请求加余量；调 API_TIMEOUT_MS 时一起改。
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        id: review
        timeout-minutes: 35
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          base_branch: ${{ steps.pr.outputs.base }}
          classify_inline_comments: "false"
          prompt: ${{ steps.cfg.outputs.prompt }}
          claude_args: ${{ steps.cfg.outputs.args }}

      # 审查期间 PR 又有推送时，这次的结论对不上最新的 head：不发总结，回帖请维护者重新 /review。
      - name: Re-check the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          now=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$now" != "$HEAD_SHA" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "审查期间 PR 有新的推送（审的是 ${HEAD_SHA:0:7}，现在是 ${now:0:7}），本次结论作废，请重新评论 /review。" &&
              touch "$RUNNER_TEMP/review-dispatch-reported"
            exit 1
          fi

      - name: Post the review summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/review-bot.mjs post --pr "$PR" --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA"
          --exec "$EXEC_FILE" --run-url "$RUN_URL"

      # 任何一步红了（含审查那一步超时）或 job 被取消（包括被新的 /review 顶掉），PR 上都要有下文：
      # 否则 Ack 之后再无动静，与「审过、没问题」无从区分。
      - name: Report failure on the PR
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ ! -e "$RUNNER_TEMP/review-dispatch-reported" ] || exit 0
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "/review 未完成：本次审查失败、超时或被取消（例如又发了一次 /review），PR 上没有审查结论不代表没有问题。日志：$RUN_URL"
